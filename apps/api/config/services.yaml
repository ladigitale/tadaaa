# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Default when the env var is unset (Symfony env() fallback).
    env(REGISTRATION_AUTO_APPROVE): '0'
    env(MERCURE_ENABLED): '1'
    env(VAPID_PUBLIC_KEY): ''
    env(VAPID_PRIVATE_KEY): ''
    env(VAPID_SUBJECT): 'mailto:noreply@tadaaa.app'
    env(MAIL_FROM): 'app@tadaaa.space'
    env(APP_PUBLIC_URL): 'http://localhost:5173'
    env(DEFAULT_STORAGE_QUOTA_BYTES): '5242880'
    env(GLOBAL_MONTHLY_TRANSFER_BYTES): '5368709120'
    env(FLOOR_PER_USER_MONTH_BYTES): '52428800'
    env(CEIL_PER_USER_MONTH_BYTES): '524288000'
    env(FLOOR_PER_USER_DAY_BYTES): '2097152'
    env(CEIL_PER_USER_DAY_BYTES): '26214400'
    # Legal identity (personne physique) — leave empty in git; set in deploy .env
    env(LEGAL_PUBLISHER_NAME): ''
    env(LEGAL_PUBLISHER_EMAIL): ''
    env(LEGAL_PUBLISHER_ADDRESS): ''
    env(LEGAL_SIRET): ''
    env(LEGAL_HOST_NAME): ''
    env(LEGAL_HOST_ADDRESS): ''
    env(LEGAL_HOST_CONTACT): ''
    env(LEGAL_PRIVACY_EMAIL): ''
    env(ARTIFACTS_PUBLIC_URL): 'http://localhost:3300'
    # Agent intégré (POST /api/agent/run). Chaque utilisateur règle son fournisseur / sa clé
    # (page « Assistant IA ») ; AGENT_LLM_* = clé du serveur, pour les admins (ou tous si SHARED=1).
    env(AGENT_LLM_API_KEY): ''
    env(AGENT_LLM_SHARED): '0'
    # Clé de chiffrement des clés API des utilisateurs (32 octets base64) ; vide = dérivée d'APP_SECRET.
    env(AGENT_SETTINGS_KEY): ''
    # URL libres vers le réseau privé (Ollama sur le LAN d'un serveur auto-hébergé) : 0 en production.
    env(AGENT_ALLOW_PRIVATE_URLS): '0'
    env(AGENT_LLM_MODEL): 'claude-sonnet-5-5'
    env(AGENT_LLM_MAX_TOKENS): '16000'
    env(AGENT_LLM_BASE_URL): 'https://api.anthropic.com'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Objets de valeur et classes construites à la main (agent intégré) : pas des services.
        exclude:
            - '../src/Agent/AgentRunner.php'
            - '../src/Agent/RunInput.php'
            - '../src/Agent/A2ui.php'
            - '../src/Agent/AgentProfile.php'
            - '../src/Agent/SystemPrompt.php'
            - '../src/Agent/AgUi/'
            - '../src/Agent/Llm/LlmResponse.php'
            - '../src/Agent/Llm/LlmUnavailable.php'
            - '../src/Agent/Tool/McpToolAdapter.php'
            - '../src/Agent/Tool/Toolbox.php'
            - '../src/Agent/Tool/ToolContext.php'
            - '../src/Agent/Tool/ToolResult.php'
            - '../src/Agent/Llm/AnthropicLlmClient.php'
            - '../src/Agent/Llm/OpenAiLlmClient.php'
            - '../src/Agent/Llm/UnconfiguredLlmClient.php'
            - '../src/Agent/Llm/LlmHttp.php'
            - '../src/Agent/Llm/LlmStream.php'
            - '../src/Agent/Llm/AnthropicStreamParser.php'
            - '../src/Agent/ThreadState.php'
            - '../src/Agent/Settings/AgentProviders.php'
            - '../src/Agent/Settings/UrlGuard.php'

    App\Service\MercureFeature:
        arguments:
            $enabled: '%env(bool:MERCURE_ENABLED)%'

    App\Service\PushFeature:
        arguments:
            $publicKey: '%env(string:VAPID_PUBLIC_KEY)%'
            $privateKey: '%env(string:VAPID_PRIVATE_KEY)%'
            $subject: '%env(string:VAPID_SUBJECT)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

