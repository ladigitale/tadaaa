# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Default when the env var is unset (Symfony env() fallback).
    env(REGISTRATION_AUTO_APPROVE): '0'
    env(MERCURE_ENABLED): '1'
    env(VAPID_PUBLIC_KEY): ''
    env(VAPID_PRIVATE_KEY): ''
    env(VAPID_SUBJECT): 'mailto:noreply@tadaaa.app'
    env(MAIL_FROM): 'app@tadaaa.space'
    env(APP_PUBLIC_URL): 'http://localhost:5173'
    env(DEFAULT_STORAGE_QUOTA_BYTES): '5242880'
    env(GLOBAL_MONTHLY_TRANSFER_BYTES): '5368709120'
    env(FLOOR_PER_USER_MONTH_BYTES): '52428800'
    env(CEIL_PER_USER_MONTH_BYTES): '524288000'
    env(FLOOR_PER_USER_DAY_BYTES): '2097152'
    env(CEIL_PER_USER_DAY_BYTES): '26214400'
    # Legal identity (personne physique) — leave empty in git; set in deploy .env
    env(LEGAL_PUBLISHER_NAME): ''
    env(LEGAL_PUBLISHER_EMAIL): ''
    env(LEGAL_PUBLISHER_ADDRESS): ''
    env(LEGAL_SIRET): ''
    env(LEGAL_HOST_NAME): ''
    env(LEGAL_HOST_ADDRESS): ''
    env(LEGAL_HOST_CONTACT): ''
    env(LEGAL_PRIVACY_EMAIL): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\MercureFeature:
        arguments:
            $enabled: '%env(bool:MERCURE_ENABLED)%'

    App\Service\PushFeature:
        arguments:
            $publicKey: '%env(string:VAPID_PUBLIC_KEY)%'
            $privateKey: '%env(string:VAPID_PRIVATE_KEY)%'
            $subject: '%env(string:VAPID_SUBJECT)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
