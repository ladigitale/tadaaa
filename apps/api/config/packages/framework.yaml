# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    rate_limiter:
        register:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            lock_factory: null
        login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            lock_factory: null
        account_gdpr:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            lock_factory: null
        agent_settings_test:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
            lock_factory: null
        agent_runs:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
            lock_factory: null
        artifacts_public:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
            lock_factory: null
        # Envois anonymes (collecte contrôlée) : en plus du quota / intervalle par collection.
        artifacts_intake:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
            lock_factory: null

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
