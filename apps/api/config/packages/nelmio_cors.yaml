nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'Mcp-Session-Id', 'Mcp-Protocol-Version']
        expose_headers: ['Link', 'WWW-Authenticate', 'Mcp-Session-Id']
        max_age: 3600
    paths:
        # Public embeds: CORS is applied dynamically per EmbedKey (EmbedCorsSubscriber).
        '^/api/public/embeds':
            origin_regex: false
            allow_origin: []
            allow_methods: ['GET', 'OPTIONS']
            allow_headers: ['Content-Type', 'If-None-Match']
            expose_headers: ['X-Tadaaa-Embed-Bytes', 'ETag']
            max_age: 3600
        '^/': null
